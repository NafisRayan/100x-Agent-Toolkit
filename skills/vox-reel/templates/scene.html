<!doctype html>
<html><head><meta charset="UTF-8"><title>Scene N</title></head>
<body>
<template>
<style>
  /* Đổi sN -> s1, s2... và data-composition-id/__timelines key -> sceneN */
  @font-face{font-family:"Playfair";src:url(assets/fonts/PlayfairDisplay-Italic.ttf);font-style:italic;font-weight:400 900}
  #root{position:absolute;inset:0;overflow:hidden;background:#000;font-family:"Playfair",serif}
  #sN-grade{position:absolute;inset:0;filter:saturate(.86) contrast(1.08) sepia(.16) brightness(.95)}
  #sN-weave{position:absolute;inset:0}
  #sN-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
  #sN-char{position:absolute;left:200px;top:700px;width:700px;transform-origin:50% 100%}
  #sN-cap{position:absolute;left:0;right:0;top:170px;text-align:center;font-style:italic;font-size:72px;color:#fff;
    text-shadow:0 4px 18px rgba(0,0,0,.55);opacity:0}
  .fx{position:absolute;inset:0;pointer-events:none}
  .scan{background:repeating-linear-gradient(to right,rgba(0,0,0,.16) 0 1.6px,transparent 1.6px 8px);filter:blur(.7px)}
  .grain{background:url(assets/textures/grain.jpg) center/1024px;mix-blend-mode:multiply;filter:invert(1) brightness(1.35) contrast(1.02);opacity:.55}
  .grunge{background:url(assets/textures/grunge.jpg) center/cover;mix-blend-mode:color-burn;opacity:.16}
  .vig{background:radial-gradient(ellipse 92% 82% at 50% 48%,transparent 55%,rgba(0,0,0,.5) 100%)}
</style>
<div id="root" data-composition-id="sceneN" data-width="1080" data-height="1920">
  <div id="sN-grade"><div id="sN-weave">
    <img id="sN-bg" src="assets/sceneN/bg.jpg" alt="">
    <img id="sN-char" src="assets/sceneN/char.png" alt="">
    <div id="sN-cap">caption line</div>
  </div></div>
  <div class="fx scan"></div><div class="fx grain"></div><div class="fx grunge"></div><div class="fx vig"></div>
</div>
<script>
(function(){
  const DUR = 5, FPS = 30, k = 1;          // DUR = data-duration của host; k < 1 nén prompt theo frame
  const F = (f) => (f / FPS) * k;
  const tl = gsap.timeline({ paused: true });
  function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  function weave(el, seed){const r=rng(seed);tl.fromTo(el,{x:0,y:0,scale:1.012},{x:(r()*2-1)*22,y:(r()*2-1)*14,scale:1.035,duration:DUR,ease:"sine.inOut"},0)}
  function boil(el, period, ds, dr, t0=0){const n=Math.max(0,Math.floor((DUR-t0)/period)-1);tl.fromTo(el,{scale:1-ds,rotation:-dr},{scale:1+ds,rotation:dr,duration:period,ease:"sine.inOut",yoyo:true,repeat:n},t0)}

  weave("#sN-weave", 11);                                            // dolly chậm, seed khác mỗi scene
  tl.fromTo("#sN-bg", {scale:1}, {scale:1.08, duration:DUR, ease:"power2.out"}, 0);   // nền zoom chậm
  tl.fromTo("#sN-char", {scale:1, y:0}, {scale:1.2, y:20, duration:1.9, ease:"power2.out"}, 0); // nhân vật zoom nhanh hơn = parallax
  boil("#sN-char", 2.6, .002, .12);
  tl.fromTo("#sN-cap", {opacity:0, y:16}, {opacity:1, y:0, duration:.3, ease:"power2.out"}, F(9));
  window.__timelines["sceneN"] = tl;
})();
</script>
</template>
</body></html>
