<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Vox reel</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
      .clip { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="29" data-width="1080" data-height="1920">
      <!-- 6 scene: data-start/data-duration lấy từ bảng Timing trong STORYBOARD.md (mốc vo.srt) -->
      <div id="host-scene1" class="clip" data-composition-id="scene1" data-composition-src="compositions/scene1.html" data-start="0"     data-duration="4.45" data-track-index="0" data-width="1080" data-height="1920"></div>
      <div id="host-scene2" class="clip" data-composition-id="scene2" data-composition-src="compositions/scene2.html" data-start="4.45"  data-duration="4.25" data-track-index="0" data-width="1080" data-height="1920"></div>
      <div id="host-scene3" class="clip" data-composition-id="scene3" data-composition-src="compositions/scene3.html" data-start="8.7"   data-duration="5.05" data-track-index="0" data-width="1080" data-height="1920"></div>
      <div id="host-scene4" class="clip" data-composition-id="scene4" data-composition-src="compositions/scene4.html" data-start="13.75" data-duration="4.85" data-track-index="0" data-width="1080" data-height="1920"></div>
      <div id="host-scene5" class="clip" data-composition-id="scene5" data-composition-src="compositions/scene5.html" data-start="18.6"  data-duration="6.2"  data-track-index="0" data-width="1080" data-height="1920"></div>
      <div id="host-scene6" class="clip" data-composition-id="scene6" data-composition-src="compositions/scene6.html" data-start="24.8"  data-duration="4.2"  data-track-index="0" data-width="1080" data-height="1920"></div>

      <div id="host-captions" class="clip" style="z-index:5" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="29" data-track-index="1" data-width="1080" data-height="1920"></div>

      <!-- audio -->
      <audio id="vo"  src="assets/audio/vo.mp3"  data-start="0" data-duration="27.65" data-track-index="10" data-volume="1"></audio>
      <audio id="bgm" src="assets/audio/bgm.mp3" data-start="0" data-duration="29"   data-track-index="11" data-volume="0.22"></audio>
      <!-- SFX theo beat -->
      <audio id="sfx-zoom"    src="assets/sfx/whoosh-cinematic.mp3" data-start="1.5"   data-track-index="13" data-volume="0.7"></audio>
      <audio id="sfx-boss"    src="assets/sfx/impact-bass-1.mp3"    data-start="5.75"  data-track-index="14" data-volume="0.8"></audio>
      <audio id="sfx-slot"    src="assets/sfx/pop.mp3"              data-start="6.35"  data-track-index="15" data-volume="0.7"></audio>
      <audio id="sfx-p1"      src="assets/sfx/whoosh-short.mp3"     data-start="9.37"  data-track-index="16" data-volume="0.6"></audio>
      <audio id="sfx-p2"      src="assets/sfx/whoosh-short.mp3"     data-start="10.7"  data-track-index="17" data-volume="0.6"></audio>
      <audio id="sfx-p3"      src="assets/sfx/whoosh-short.mp3"     data-start="12.03" data-track-index="18" data-volume="0.6"></audio>
      <audio id="sfx-shift"   src="assets/sfx/impact-bass-2.mp3"    data-start="15.75" data-track-index="19" data-volume="0.7"></audio>
      <audio id="sfx-cash"    src="assets/sfx/chime.mp3"            data-start="19.37" data-track-index="20" data-volume="0.5"></audio>
      <audio id="sfx-sparkle" src="assets/sfx/sparkle.mp3"          data-start="19.7"  data-track-index="21" data-volume="0.4"></audio>
      <audio id="sfx-finger"  src="assets/sfx/pop.mp3"              data-start="26.3"  data-track-index="22" data-volume="0.7"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set("#root", { opacity: 1 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
